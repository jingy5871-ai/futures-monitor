name: 期货监控

on:
  schedule:
    # 北京时间 20:15 对应 UTC 12:15
    - cron: '15 12 * * *'
  workflow_dispatch: # 允许手动点击测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安装依赖并运行
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          pip install requests
          python main.py
